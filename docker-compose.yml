version: '3.8'

services:
  quantumbio-localmoe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:secret@postgres:5432/localmoe
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MODEL_DIRECTORY=/models
      - MODEL_EXTRA_DIRECTORIES=/models-extra
      - MODEL_NAME=${MODEL_NAME:-DeepSeek-R1-Distill-Qwen-1.5B-Q6_K_L.gguf}
    volumes:
      - ./models:/models
      # Shared LLMS weights (defined by LLMS_MODEL_PATH in .env)
      - ${LLMS_MODEL_PATH:-./models}:/models-extra:ro
      - ./outputs:/app/outputs
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: localmoe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: