apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantumbio-localmoe.fullname" . }}
  labels:
    {{- include "quantumbio-localmoe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quantumbio-localmoe.name" . }}
  template:
    metadata:
      labels:
        {{- include "quantumbio-localmoe.labels" . | nindent 8 }}
    spec:
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: quantumbio-localmoe
          image: {{ include "quantumbio-localmoe.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.modelStorage.mountPath }}
              readOnly: {{ .Values.modelStorage.responsibleReadOnly }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: models
          hostPath:
            path: /models
            type: DirectoryOrCreate