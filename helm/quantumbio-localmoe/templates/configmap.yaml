apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quantumbio-localmoe.fullname" . }}
  labels:
    {{- include "quantumbio-localmoe.labels" . | nindent 4 }}
data:
  LOCALMOE_LOG_LEVEL: {{ .Values.env.LOCALMOE_LOG_LEVEL | quote }}
  MODEL_DIRECTORY: {{ .Values.env.MODEL_DIRECTORY | quote }}
  QUANTIZATION_TYPE: {{ .Values.env.QUANTIZATION_TYPE | quote }}